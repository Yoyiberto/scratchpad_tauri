<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plain Notepad</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js" defer></script>
  </head>
  <body>
    <header class="toolbar">
      <button type="button" id="btn-new" tabindex="-1" title="New tab (Ctrl+N)">New</button>
      <button type="button" id="btn-open" tabindex="-1" title="Open (Ctrl+O)">Open</button>
      <button type="button" id="btn-save" tabindex="-1" title="Save (Ctrl+S)">Save</button>
      <button type="button" id="btn-save-as" tabindex="-1" title="Save As">Save As</button>
      <span class="sep"></span>
      <button type="button" id="btn-snap" tabindex="-1" title="Save snapshot vN in this thread">
        Snap
      </button>
      <span id="snap-info" class="snap-info"></span>
      <span class="spacer"></span>
      <button type="button" id="btn-wrap" tabindex="-1" title="Toggle word wrap" aria-pressed="true">
        Wrap
      </button>
      <label class="theme-label" title="Theme">
        <select id="theme-select" tabindex="-1" aria-label="Theme">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
          <option value="system">System</option>
        </select>
      </label>
    </header>

    <nav id="tabs" class="tabs" aria-label="Open files"></nav>

    <textarea
      id="editor"
      spellcheck="false"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      wrap="soft"
    ></textarea>

    <footer id="status" class="status"></footer>
  </body>
</html>
