<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scratchpad</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem("theme") || "system";
          var isDark = t === "dark" || (t === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js" defer></script>
  </head>
  <body>
    <!-- GNOME / Ubuntu Style Slim Headerbar with Integrated Window Controls -->
    <header id="headerbar" class="headerbar" data-tauri-drag-region>
      <div class="header-left">
        <button type="button" id="btn-open" class="btn btn-pill" title="Open file (Ctrl+O)">
          <span>Open</span>
          <span class="chevron">▾</span>
        </button>
        <button type="button" id="btn-new" class="btn btn-icon" title="New tab (Ctrl+N)">
          <span class="icon-plus">+</span>
        </button>
        <button type="button" id="btn-save" class="btn btn-pill" title="Save file (Ctrl+S)">
          <span>Save</span>
        </button>
      </div>

      <div class="header-spacer" data-tauri-drag-region></div>

      <div class="header-right">
        <button type="button" id="btn-snap" class="btn btn-pill" title="Save snapshot vN in this thread">
          <span>Snap</span>
        </button>
        <button type="button" id="btn-corrections" class="btn btn-pill btn-highlight" title="Transcription Corrections Log">
          <span>Corrections</span>
          <span id="corr-badge" class="badge">0</span>
        </button>
        <div class="menu-wrapper">
          <button type="button" id="btn-menu" class="btn btn-icon" title="Menu & Settings" aria-label="Menu">
            <span>⋮</span>
          </button>
          <div id="app-menu" class="menu-dropdown hidden">
            <button type="button" class="menu-item" id="menu-save-as">Save As... <span class="shortcut">Ctrl+Shift+S</span></button>
            <button type="button" class="menu-item" id="menu-wrap"><span id="menu-wrap-text">Word Wrap: On</span> <span class="shortcut">Alt+Z</span></button>
            <button type="button" class="menu-item" id="menu-dc-toggle"><span id="menu-dc-text">Trigger: Ctrl+Double-Click</span></button>
            <hr class="menu-divider" />
            <div class="menu-row theme-menu-row">
              <span class="menu-row-label">
                <span id="theme-indicator-icon" class="theme-indicator-icon">☀️</span>
                <span>Theme:</span>
              </span>
              <div class="theme-switch-group" role="radiogroup" aria-label="Theme selection">
                <button type="button" class="theme-btn" data-theme-val="light" title="Modo Normal Sol (Light)" aria-label="Modo Normal Sol">
                  <span class="theme-btn-icon">☀️</span>
                  <span class="theme-btn-text">Light</span>
                </button>
                <button type="button" class="theme-btn" data-theme-val="dark" title="Modo Noche (Dark)" aria-label="Modo Noche">
                  <span class="theme-btn-icon">🌙</span>
                  <span class="theme-btn-text">Dark</span>
                </button>
                <button type="button" class="theme-btn" data-theme-val="system" title="Modo Sistema (Auto)" aria-label="Modo Sistema">
                  <span class="theme-btn-icon">💻</span>
                  <span class="theme-btn-text">System</span>
                </button>
              </div>
              <select id="theme-select" class="theme-select sr-only" aria-label="Theme" style="display: none;">
                <option value="light">☀️ Light</option>
                <option value="dark">🌙 Dark</option>
                <option value="system">💻 System</option>
              </select>
            </div>
            <div class="menu-row">
              <span class="menu-row-label">Font Size:</span>
              <div class="font-controls">
                <button type="button" id="btn-font-dec" class="btn-micro" title="Decrease font (Ctrl+- or Ctrl+Wheel Down)">-</button>
                <span id="font-size-label" class="font-label">14px</span>
                <button type="button" id="btn-font-inc" class="btn-micro" title="Increase font (Ctrl++ or Ctrl+Wheel Up)">+</button>
              </div>
            </div>
            <hr class="menu-divider" />
            <button type="button" class="menu-item" id="menu-view-corrections">View Corrections Log</button>
          </div>
        </div>

        <!-- Integrated GNOME Window Controls -->
        <div class="window-controls">
          <button type="button" id="win-btn-min" class="win-btn" title="Minimize" aria-label="Minimize">
            <span>−</span>
          </button>
          <button type="button" id="win-btn-max" class="win-btn" title="Maximize / Restore" aria-label="Maximize">
            <span>□</span>
          </button>
          <button type="button" id="win-btn-close" class="win-btn win-close" title="Close" aria-label="Close">
            <span>✕</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Ubuntu Style Tab Strip -->
    <nav id="tabs" class="tabs-bar" aria-label="Open files" data-tauri-drag-region></nav>

    <!-- Main Editor -->
    <main class="editor-wrap">
      <textarea
        id="editor"
        spellcheck="false"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        wrap="soft"
        placeholder="Write or paste text here... (Ctrl + Double-click any word to correct transcription)"
      ></textarea>
    </main>

    <!-- Footer Status -->
    <footer id="status" class="status-bar"></footer>

    <!-- Transcription Correction Modal -->
    <div id="corr-modal" class="modal-backdrop hidden">
      <div class="modal-window" role="dialog" aria-labelledby="corr-modal-title">
        <div class="modal-header">
          <h3 id="corr-modal-title" class="modal-title">Transcription Correction</h3>
          <button type="button" id="corr-close-btn" class="modal-close-btn" title="Cancel (Esc)">×</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Original Word:</label>
            <div id="corr-orig-word" class="word-badge"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="corr-new-word">Corrected Word:</label>
            <input type="text" id="corr-new-word" class="form-input" placeholder="Type correction here..." autocomplete="off" />
          </div>
          <div class="form-group">
            <label class="form-label">Context (Full Paragraph):</label>
            <div id="corr-context" class="context-preview"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" id="corr-btn-cancel" class="btn btn-secondary">Cancel (Esc)</button>
          <button type="button" id="corr-btn-save" class="btn btn-primary">Apply & Save (Enter)</button>
        </div>
      </div>
    </div>

    <!-- Corrections History Log Modal -->
    <div id="history-modal" class="modal-backdrop hidden">
      <div class="modal-window modal-window-large" role="dialog" aria-labelledby="history-modal-title">
        <div class="modal-header">
          <h3 id="history-modal-title" class="modal-title">Transcription Corrections Log</h3>
          <button type="button" id="history-close-btn" class="modal-close-btn" title="Close">×</button>
        </div>
        <div class="modal-body">
          <div class="history-controls">
            <span id="history-summary" class="history-summary">0 corrections saved</span>
            <div class="history-actions">
              <button type="button" id="btn-export-json" class="btn btn-pill">Export JSON</button>
              <button type="button" id="btn-export-csv" class="btn btn-pill">Export CSV</button>
              <button type="button" id="btn-clear-corrections" class="btn btn-danger-pill">Clear All</button>
            </div>
          </div>
          <div class="table-container">
            <table class="corrections-table">
              <thead>
                <tr>
                  <th style="width: 15%">Original</th>
                  <th style="width: 15%">Corrected</th>
                  <th style="width: 50%">Context (Paragraph)</th>
                  <th style="width: 20%">Date & Time</th>
                </tr>
              </thead>
              <tbody id="corrections-tbody">
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
